apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  labels:
    app.kubernetes.io/name: {{ include "vllm-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.vllm.service.type }}
  selector:
    app.kubernetes.io/component: vllm
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.vllm.service.port }}
      targetPort: http
      {{- if eq .Values.vllm.service.type "NodePort" }}
      nodePort: {{ .Values.vllm.service.nodePort }}
      {{- end }}
