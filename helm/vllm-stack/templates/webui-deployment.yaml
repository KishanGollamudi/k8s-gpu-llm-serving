apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: {{ include "vllm-stack.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: webui
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: webui
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: open-webui
          image: "{{ .Values.webui.image.repository }}:{{ .Values.webui.image.tag }}"
          imagePullPolicy: {{ .Values.webui.image.pullPolicy }}
          env:
            - name: OPENAI_API_BASE_URL
              value: http://vllm-service:8000/v1
            - name: OPENAI_API_KEY
              value: "none"
          ports:
            - name: http
              containerPort: 8080
          resources:
            {{- toYaml .Values.webui.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.webui.persistence.enabled }}
            - name: data
              mountPath: /app/backend/data
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        {{- if .Values.webui.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "vllm-stack.fullname" . }}-webui
        {{- end }}
